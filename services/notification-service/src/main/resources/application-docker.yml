# Active inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/notification_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
  data:
    redis:
      host: ${REDIS_HOST:redis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  mail:
    host: ${SPRING_MAIL_HOST:mailpit}          # Phase 12: Mailpit's SMTP (compose sets GROCERY_MAIL_ENABLED=true)
    port: ${SPRING_MAIL_PORT:1025}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8101/.well-known/jwks.json}

logging:
  structured:
    format:
      console: ecs
