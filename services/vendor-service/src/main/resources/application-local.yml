# Run from the IDE while everything else runs in Docker:
#   docker compose stop vendor-service   (in infrastructure/local), then run VendorServiceApplication with profile "local".
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.grocery: DEBUG
