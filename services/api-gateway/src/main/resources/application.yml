# Phase 13 observability (docs/api/phase-13-observability-and-testing.md §1) — by hand, the same as grocery-common
# 0.9.0 gives the services. The gateway is the only internet-facing unit, so its actuator (health, info and its OWN
# metrics) listens on a separate, internal management port: Prometheus scrapes api-gateway:9080, the container health
# check and the ADOT sidecar use localhost:9080, and on the public port every /actuator/** path answers 404. Load
# balancers check readiness through GET /api/health/gateway (GatewayHealthController). No route ever forwards
# /actuator/** to a service.
management:
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:                                        # common tags on every meter (as grocery-common's customizer)
      service: ${spring.application.name}
      env: ${GROCERY_ENV:local}
      instance: ${HOSTNAME:${COMPUTERNAME:localhost}}   # the container id in Docker, the pod in Kubernetes
    distribution:
      slo:                                       # explicit buckets → p95 with histogram_quantile (SlowRequests)
        "[http.server.requests]": ${grocery.observability.latency-slo:50ms,100ms,250ms,500ms,1s,2s,5s}
        # proxied requests are uri="UNKNOWN" in http.server.requests: the gateway's p95 per route comes from this one
        "[spring.cloud.gateway.requests]": ${grocery.observability.latency-slo:50ms,100ms,250ms,500ms,1s,2s,5s}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 0.1 in AWS; downstream services keep this decision
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP/HTTP; without a collector the batches are dropped in the background (requests never wait)
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    resource-attributes:
      "[deployment.environment.name]": ${GROCERY_ENV:local}
      "[service.instance.id]": ${HOSTNAME:${COMPUTERNAME:localhost}}

# ECS log lines (docker profile) carry the environment and the instance, as grocery-common sets them for the services;
# traceId / spanId / correlationId come from the MDC
logging:
  structured:
    ecs:
      service:
        environment: ${GROCERY_ENV:local}
        node-name: ${HOSTNAME:${COMPUTERNAME:localhost}}

info:
  service: api-gateway
  phase: 12
