# Active inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/identity_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
  data:
    redis:
      host: ${REDIS_HOST:redis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

logging:
  structured:
    format:
      console: ecs           # JSON logs; MDC correlationId is included automatically
