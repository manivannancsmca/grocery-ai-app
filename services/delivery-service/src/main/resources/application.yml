# Defaults = running from the IDE against the Dockerised infrastructure (profile "local").
server:
  port: 8112
  shutdown: graceful

spring:
  application:
    name: delivery-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/delivery_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME:delivery_user}
    password: ${DB_PASSWORD:delivery_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 100   # timelines of an admin page in a few queries
  # Phase 9: the GEO set of online partners (an index only: the database decides who is available)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}
  # Zero trust: this service validates every JWT itself (signature via identity JWKS, issuer, audience).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://identity.grocery.local}
          audiences: grocery-api

# Phase 9: deliveries, offers and assignment (docs/api/phase-9-delivery.md §2)
grocery:
  approvals:
    enabled: true          # Phase 12: REASSIGN_DELIVERY from the delivery assistant carries an X-Approval-Token (JWKS: APPROVAL_JWKS_URI)
  # Admin platform settings (docs/api/platform-settings.md): offer-ttl, offer-batch-size, search-radii-km and
  # location-stale-after below are the defaults; an admin's saved value overrides them. Each instance re-reads the
  # overrides at most this often.
  settings:
    cache-ttl: ${PLATFORM_SETTINGS_CACHE_TTL:15s}
  delivery:
    offer-ttl: ${DELIVERY_OFFER_TTL:30s}                          # how long a partner has to accept an offer
    offer-batch-size: ${DELIVERY_OFFER_BATCH_SIZE:2}              # partners offered per wave (the nearest available)
    search-radii-km: ${DELIVERY_SEARCH_RADII_KM:3,6,10}           # radius steps around the pickup point, ascending
    poll-interval: ${DELIVERY_POLL_INTERVAL:5s}                   # pause between dispatch poller runs
    retry-interval: ${DELIVERY_RETRY_INTERVAL:60s}                # fresh search after nobody was found in the largest radius
    location-stale-after: ${DELIVERY_LOCATION_STALE_AFTER:60s}    # older last location = not available
    location-min-interval: 2s                                     # reports closer together are accepted, not stored or published
    trail-sample-interval: 15s                                    # at most one location_sample row per delivery per 15 s
    poll-batch-size: 20                                           # deliveries claimed per poller transaction (SKIP LOCKED)
    pollers-enabled: ${DELIVERY_POLLERS_ENABLED:true}             # the dispatch poller in this instance (safe in every replica)
    timezone: Asia/Kolkata                                        # the days of the partner's delivery summary
    # Phase 10 housekeeping: location_sample rows older than this are deleted (batches of 1000, with the pollers)
    location-sample-retention: ${DELIVERY_LOCATION_SAMPLE_RETENTION:30d}
    location-sample-cleanup-interval: 1h
    # The partner dashboard's estimated earnings: per delivered order, base + per-km × trip distance (store → customer,
    # straight line). PLACEHOLDER rates, not a pay policy: set DELIVERY_PAY_BASE / DELIVERY_PAY_PER_KM to your real ones.
    pay:
      base-per-delivery: ${DELIVERY_PAY_BASE:25.00}
      per-km: ${DELIVERY_PAY_PER_KM:6.00}
      currency: INR

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  service: delivery-service
  phase: 12
