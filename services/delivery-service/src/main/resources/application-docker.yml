# Active inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/delivery_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
  data:
    redis:
      host: ${REDIS_HOST:redis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8101/.well-known/jwks.json}

logging:
  structured:
    format:
      console: ecs
