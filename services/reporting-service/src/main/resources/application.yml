# Defaults = running from the IDE against the Dockerised infrastructure (profile "local").
server:
  port: 8116
  shutdown: graceful

spring:
  application:
    name: reporting-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/reporting_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME:reporting_user}
    password: ${DB_PASSWORD:reporting_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  # One consumer group over the five topics of contract §7 (order, payment, delivery, review, vendor events). From the
  # beginning on a new group (= a rebuild, see README.md).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}
      concurrency: 3
  # Zero trust: this service validates every JWT itself (signature via identity JWKS, issuer, audience).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://identity.grocery.local}
          audiences: grocery-api

grocery:
  reporting:
    # The central audit trail (README "Audit trail"): how long entries are kept, purged daily at 03:40 India time.
    audit:
      sign-in-retention: ${AUDIT_SIGN_IN_RETENTION:180d}   # sign-in events (category SECURITY)
      retention: ${AUDIT_RETENTION:730d}                   # everything else
      purge-cron: "0 40 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  service: reporting-service
  phase: 12
