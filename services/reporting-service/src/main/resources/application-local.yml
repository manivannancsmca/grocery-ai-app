# Run from the IDE while everything else runs in Docker:
#   docker compose stop reporting-service   (in infrastructure/local), then run ReportingServiceApplication with
#   profile "local": MySQL on localhost:3307, Kafka on localhost:9092, identity JWKS on localhost:8101.
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.grocery: DEBUG
