# Defaults = running from the IDE against the Dockerised infrastructure (profile "local").
server:
  port: 8114
  shutdown: graceful

grocery:
  # Admin platform settings (docs/api/platform-settings.md): review.review-window below is the default of the reviews
  # area; an admin's saved value overrides it. Each instance re-reads the overrides at most this often.
  settings:
    cache-ttl: ${PLATFORM_SETTINGS_CACHE_TTL:15s}
  review:
    # docs/api/phase-12-post-mvp-features.md §1
    review-window: ${REVIEW_WINDOW:30d}            # a delivered order can be reviewed this long after delivery
    edit-window: ${REVIEW_EDIT_WINDOW:7d}          # the customer may edit a review this long after writing it
    eligible-orders-limit: 50                      # GET /api/reviews/eligible without orderId: newest delivered orders
    republish-batch-size: 200                      # rating summaries per transaction on an admin republish
    moderation:
      # One word per line, '#' comments; whole words, case-insensitive (classpath: or file: resource).
      words: ${REVIEW_MODERATION_WORDS:classpath:moderation/words.txt}
      # More than this share of upper-case letters is flagged, once the review has at least min-letters letters
      # (so "OK" or "GOOD" are not flagged as shouting).
      upper-case-ratio: 0.70
      upper-case-min-letters: 10

spring:
  application:
    name: review-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/review_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME:review_user}
    password: ${DB_PASSWORD:review_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # A change of the published reviews of a target locks the target's rating_summary row and then recomputes the
      # summary with an aggregate query; READ COMMITTED makes that query see every change committed before the lock
      # was granted (no REPEATABLE READ snapshot taken earlier in the transaction, no gap locks).
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}
  # Zero trust: this service validates every JWT itself (signature via identity JWKS, issuer, audience).
  # GET /api/reviews and GET /api/reviews/summary are public (ReviewSecurityConfig): a token is accepted, not required.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://identity.grocery.local}
          audiences: grocery-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  service: review-service
  phase: 12
