# Active inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
grocery:
  ai:
    gateway-url: ${GROCERY_AI_GATEWAY_URL:http://api-gateway:8080}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/ai_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8101/.well-known/jwks.json}

logging:
  structured:
    format:
      console: ecs
