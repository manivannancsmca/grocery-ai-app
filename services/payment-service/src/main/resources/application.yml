# Defaults = running from the IDE against the Dockerised infrastructure (profile "local").
server:
  port: 8111
  shutdown: graceful

grocery:
  approvals:
    enabled: true          # Phase 11: verify X-Approval-Token on AI-approved calls (JWKS from APPROVAL_JWKS_URI)
  payment:
    # razorpay | simulator. Empty = razorpay when RAZORPAY_KEY_ID is set, otherwise simulator (simulator only with
    # the "docker" or "local" profile; see README "Simulator mode").
    provider: ${PAYMENT_PROVIDER:}
    merchant-name: Grocery AI
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
    http:
      connect-timeout: 2s
      read-timeout: 10s
    # Payment window poller (env GROCERY_PAYMENT_EXPIRY_POLL_INTERVAL) and refund retry poller
    # (env GROCERY_PAYMENT_REFUND_RETRY_INTERVAL; also the base of the refund backoff). Both are safe in every replica.
    expiry-poll-interval: 30s
    expiry-batch-size: 50
    refund-retry-interval: 60s
    refund-batch-size: 20
    poll-lease: 2m
    pollers-enabled: true
    # Phase 10: payment reconciliation (docs/api/phase-10-event-driven-hardening.md §3): PENDING payments whose Razorpay
    # order is older than reconcile-after are checked at the provider (lost verify call AND lost webhook); safe in every
    # replica, runs with the other pollers (pollers-enabled).
    reconcile-interval: ${PAYMENT_RECONCILE_INTERVAL:2m}
    reconcile-after: ${PAYMENT_RECONCILE_AFTER:2m}
    reconcile-batch-size: 50
  security:
    # Razorpay calls the webhook without a token (it is authenticated by its HMAC signature instead).
    public-paths:
      - /api/payments/razorpay/webhook

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:payment_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # Every change locks the payment row first and reads everything else after the lock; READ COMMITTED makes
      # those reads see the latest committed rows (no REPEATABLE READ snapshot taken before the lock, no gap locks).
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 100
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}
  cloud:
    circuitbreaker:
      resilience4j:
        # Calls run on the caller's (virtual) thread; the HTTP timeouts bound them.
        disable-thread-pool: true
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false
  # Zero trust: this service validates every JWT itself (signature via identity JWKS, issuer, audience).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://identity.grocery.local}
          audiences: grocery-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  service: payment-service
  phase: 12
