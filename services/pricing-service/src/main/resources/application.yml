# Defaults = running from the IDE against the Dockerised infrastructure (profile "local").
server:
  port: 8108
  shutdown: graceful

grocery:
  # Admin platform settings (docs/api/platform-settings.md): pricing.delivery-fees below are the defaults of the
  # delivery-fees area; an admin's saved value overrides them. Each instance re-reads the overrides at most this often.
  settings:
    cache-ttl: ${PLATFORM_SETTINGS_CACHE_TTL:15s}
  approvals:
    enabled: true          # Phase 12: CHANGE_PRICE from the vendor assistant carries an X-Approval-Token (JWKS: APPROVAL_JWKS_URI)
  pricing:
    # A selling-price change of more than this many percent (either direction) needs an admin's approval.
    approval-threshold-percent: ${PRICING_APPROVAL_THRESHOLD_PERCENT:20}
    # How long a price quote stays in Redis (key price:v1:<productId>).
    quote-cache-ttl: ${PRICING_QUOTE_CACHE_TTL:10m}
    # The delivery fees of the checkout preview, in INR and km (docs/api/platform-settings.md, area delivery-fees):
    # the defaults of the admin platform settings. cart-service reads the values in force from /internal/delivery-fees
    # and keeps the same numbers in grocery.cart.delivery.* only as its fallback: keep the two equal.
    delivery-fees:
      grocery-base-fee: 25.00
      grocery-included-km: 3
      grocery-per-extra-km: 8.00
      grocery-free-above: 499.00
      grocery-minimum-order: 99.00
      restaurant-base-fee: 30.00
      restaurant-included-km: 3
      restaurant-per-extra-km: 10.00
    # Phase 12 §2: coupons. A RESERVED redemption (redeem at order placement) without OrderCreated for this long is
    # released by the sweeper (the order was never saved). The sweeper is safe in every replica (SKIP LOCKED).
    coupons:
      reservation-ttl: ${COUPON_RESERVATION_TTL:30m}
      sweep-interval: ${COUPON_SWEEP_INTERVAL:1m}
      sweep-batch-size: 100
      sweeper-enabled: ${COUPON_SWEEPER_ENABLED:true}

spring:
  application:
    name: pricing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/pricing_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME:pricing_user}
    password: ${DB_PASSWORD:pricing_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 100
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  # The quote cache. Redis is optional: when it is down or slow the service reads MySQL instead
  # (short timeouts: a cache that answers slower than MySQL is no help).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 1s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}
  # Zero trust: this service validates every JWT itself (signature via identity JWKS, issuer, audience).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://identity.grocery.local}
          audiences: grocery-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The cache is optional: Redis being down must not mark the service DOWN.
    redis:
      enabled: false

info:
  service: pricing-service
  phase: 12
