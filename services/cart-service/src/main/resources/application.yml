# Defaults = running from the IDE against the Dockerised infrastructure (profile "local").
server:
  port: 8109
  shutdown: graceful

grocery:
  cart:
    ttl: ${CART_TTL:30d}                   # a cart lives this long after its last change (key cart:v1:<customerId>)
    max-quantity-per-line: 20
    max-lines: 30
    write-retries: 3                       # compare-and-set retries before 409 CONCURRENT_MODIFICATION
    http:
      connect-timeout: 1s
      read-timeout: 2500ms
    services:
      pricing: ${PRICING_SERVICE_URL:http://localhost:8108}
      inventory: ${INVENTORY_SERVICE_URL:http://localhost:8107}
      catalog-query: ${CATALOG_QUERY_SERVICE_URL:http://localhost:8106}
      vendor: ${VENDOR_SERVICE_URL:http://localhost:8103}
      restaurant: ${RESTAURANT_SERVICE_URL:http://localhost:8104}
      customer: ${CUSTOMER_SERVICE_URL:http://localhost:8102}
    # One breaker per dependency (pricing, inventory, catalog, vendor, restaurant, customer).
    circuit-breaker:
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 3
    # Checkout preview delivery charges (contract §3). Money in INR, distances in km.
    # The fees (base-fee, included-km, per-extra-km, free-above, minimum-order) are admin platform settings owned by
    # pricing-service (grocery.pricing.delivery-fees.*, docs/api/platform-settings.md): the preview charges what
    # GET /internal/delivery-fees answers, read again every settings-cache-ttl. The fees below are only the fallback
    # before pricing-service has answered once: keep them equal to pricing-service's. road-factor and max-distance-km
    # are always these: vendor-service's "stores near you" (grocery.stores.*) uses the same numbers.
    delivery:
      road-factor: 1.3
      settings-cache-ttl: ${DELIVERY_FEES_CACHE_TTL:15s}
      grocery:
        included-km: 3
        base-fee: 25.00
        per-extra-km: 8.00
        free-above: 499.00
        max-distance-km: 15
        minimum-order: 99.00
      restaurant:
        included-km: 3
        base-fee: 30.00
        per-extra-km: 10.00
        max-distance-km: 12
        # no free-above and no minimum order for restaurants

spring:
  application:
    name: cart-service
  threads:
    virtual:
      enabled: true
  # The only store of this service. Without Redis there is no cart: requests fail with 503 CART_UNAVAILABLE.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false
  # order.events → OrderCreated empties the cart the order was placed from (consumer cart-service.order-events).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}
  cloud:
    circuitbreaker:
      resilience4j:
        # Calls run on the request's (virtual) thread; the HTTP read timeout bounds them.
        disable-thread-pool: true
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false
  # Zero trust: this service validates every JWT itself (signature via identity JWKS, issuer, audience).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://identity.grocery.local}
          audiences: grocery-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  service: cart-service
  phase: 12
