# Classes run in the order of their @Order (unannotated ones in the middle): the cheap smoke/contract checks first,
# the rate-limit test (which drains the per-IP auth bucket on purpose) last.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
# Global extension that cancels this run's open orders when the whole run ends (see RunCleanupExtension).
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
