# The previous release of every service with Flyway migrations: its last migration version BEFORE this release.
# For this release (Phase 13) that is the highest version below the service's V<n>__outbox_traceparent.sql, or the
# service's latest version where Phase 13 added none (customer-, notification- and reporting-service publish no events).
#
# Migrations above the baseline are new in this release. tests/db-tests checks that they
#   - apply on top of the released schema holding a representative row in every table, and
#   - pass the expand/contract lint (no DROP / RENAME of tables or columns, no narrowing MODIFY,
#     no ADD COLUMN ... NOT NULL without DEFAULT on an existing table).
# Earlier migrations were pre-release and are only applied from scratch.
#
# When a release ships, move every value to that release's last migration version.
# A service that is new in a release: <service>=0 (all its migrations are new; its own tables are exempt from the lint).
ai-orchestrator-service=3
catalog-command-service=3
customer-service=2
delivery-service=6
identity-service=3
inventory-service=5
notification-service=7
order-service=8
payment-service=6
pricing-service=5
reporting-service=2
restaurant-service=6
review-service=2
vendor-service=6
