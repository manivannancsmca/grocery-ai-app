# Accepted schema lint findings: <service>/<rule>/<object> = the reason.
# Every other finding fails the build; an entry that no longer matches a finding fails it too (remove it).
# Prefer a new expand-only migration in the service; an exception needs a reason that will still hold next release.

# notification-service and reporting-service publish no events (docs/events/event-catalog.md: notification "publishes
# no events"; reporting is the read-only analytics consumer), so their V1 platform tables create processed_event only.
# An outbox_event table nothing writes would be dead schema; it comes with the service's first published event, in
# the same change as its publisher (then the lint checks its columns like everywhere else).
notification-service/outbox-table/outbox_event=publishes no events: no transactional outbox by design (event catalog)
reporting-service/outbox-table/outbox_event=publishes no events: read-only analytics consumer, no outbox by design
