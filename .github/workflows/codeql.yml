# Static analysis (CodeQL) of the Java services and the JavaScript frontend. Results appear under Security ->
# Code scanning. Java is analysed without a build (build-mode: none), so no Maven setup is needed here.
name: CodeQL

on:
  push:
    branches: [main]
    paths: ["services/**", "libs/**", "frontend/grocery-web-ui/**", ".github/workflows/codeql.yml"]
  pull_request:
    branches: [main]
    paths: ["services/**", "libs/**", "frontend/grocery-web-ui/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "17 3 * * 1"   # weekly, for newly published queries

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - frontend/grocery-web
              - "**/node_modules"
              - "**/target"
              - tests/performance
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
