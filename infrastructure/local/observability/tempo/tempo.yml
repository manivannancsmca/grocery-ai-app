# =====================================================================================
# Tempo — single binary, local storage, traces kept 1 day (Phase 13 §2).
# Receives OTLP from otel-collector only (services → otel-collector:4318 → tempo:4317).
# =====================================================================================
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

query_frontend:
  search:
    duration_slo: 5s
  trace_by_id:
    duration_slo: 5s

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    ingestion:
      max_traces_per_user: 20000

usage_report:
  reporting_enabled: false
