# =====================================================================================
# OpenTelemetry Collector — the services' OTLP endpoint (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318).
# Traces (W3C traceparent context, propagated by the services and through the outbox/Kafka headers) → Tempo.
# In AWS (Phase 14) ADOT collectors take this role and export to X-Ray.
# =====================================================================================
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 230                # below GOMEMLIMIT (240) and mem_limit (288m); the contrib build idles at ~115
    spike_limit_mib: 50
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 1000

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
