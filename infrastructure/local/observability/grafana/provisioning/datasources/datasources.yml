# Grafana datasources (fixed UIDs: the dashboards reference prometheus / loki / tempo / alertmanager).
# Links: Prometheus exemplars → Tempo; Loki log line traceId → Tempo; Tempo span → Loki logs (traceId) and
# → Prometheus request metrics of the span's service.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: Alertmanager
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Open trace in Tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # The ECS JSON line carries "traceId":"<32 hex>" (and it is structured metadata too).
        - name: traceId
          matcherType: regex
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: Open trace in Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service=~".+"} | traceId="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: 'sum by (uri, status) (rate(http_server_requests_seconds_count{$$__tags}[1m]))'
          - name: p95 latency
            query: 'histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{$$__tags}[1m])))'
      lokiSearch:
        datasourceUid: loki
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-30m"
        spanEndTimeShift: "30m"

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
