# Main nginx configuration of the production web image (Dockerfile.prod).
# nginxinc/nginx-unprivileged runs as uid 101: the pid file and every temp path live in /tmp, and the server listens on
# 8080 (no privileged port). The server block is rendered at start-up from templates/default.conf.template.
# Static files and one proxy: two workers are plenty ("auto" would start one per host CPU, ignoring the container's
# CPU limit).
worker_processes 2;
error_log /var/log/nginx/error.log notice;   # symlinked to stderr by the base image
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;            # no nginx version in headers or error pages
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 5m;      # API request bodies are small JSON; nothing is uploaded through the web tier

    # One JSON object per line, like the services' logs (CloudWatch Logs / Loki parse it without a custom pattern).
    log_format json escape=json
        '{"@timestamp":"$time_iso8601","service":"grocery-web","log.level":"info",'
        '"client.ip":"$remote_addr","http.forwarded_for":"$http_x_forwarded_for",'
        '"http.request.method":"$request_method","url.path":"$uri","http.response.status_code":$status,'
        '"http.response.body.bytes":$body_bytes_sent,"event.duration_s":$request_time,'
        '"upstream.response_time_s":"$upstream_response_time","user_agent.original":"$http_user_agent",'
        '"traceparent":"$http_traceparent"}';
    access_log /var/log/nginx/access.log json;   # symlinked to stdout by the base image

    # Compression for the SPA's text assets. /api responses are never compressed here (see default.conf).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
               image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
